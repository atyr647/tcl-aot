name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang zlib1g-dev valgrind
      - name: Build Tcl 8.6.14 and the translator shell
        run: make -j"$(nproc)" tcl shell
      - name: Tests (gcc)
        run: make test
      - name: Differential tests with clang compiling the generated code
        run: CC=clang tests/run.sh quick
